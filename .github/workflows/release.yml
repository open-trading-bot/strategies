name: Release

# Publishes the package to npm when a GitHub release is published.
# It uses npm trusted publishing, so it needs no npm token.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Trusted publishing needs npm 11.5.1 or later. Node.js 24 includes it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "The tag $TAG does not match the package version $VERSION."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      # prepublishOnly runs the tests and the build.
      - name: Publish
        run: npm publish --access public
