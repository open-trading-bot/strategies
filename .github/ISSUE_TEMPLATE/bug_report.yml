name: Bug report
description: Report a problem in a strategy or in the backtester.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not put API keys, secrets or account details in this issue.
        To report a security vulnerability, read SECURITY.md. Do not open a public issue.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Write what you saw and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Write a short script, if possible. Include the strategy ID, the parameters and the candles.
      render: js
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.3
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Node.js 22 on macOS
